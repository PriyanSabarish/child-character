<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child Character Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #121212;
      color: #f0f0f0;
      font-family: system-ui, -apple-system, sans-serif;
      gap: 16px;
    }
    canvas {
      background-color: #1e1e1e;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.secondary {
      background: #374151;
    }
    button:hover {
      background: #1d4ed8;
    }
    button.secondary:hover {
      background: #4b5563;
    }
    button:active {
      transform: scale(0.98);
    }
    .status {
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Child Character Companion</h1>
  <canvas id="characterCanvas"></canvas>
  <div class="controls">
    <button id="playSpeechBtn">Play Piper Speech</button>
    <button id="testAudioBtn" class="secondary">Synthetic Beeps</button>
  </div>
  <p id="status" class="status">Loading...</p>

  <script type="module" src="renderer.js"></script>
</body>
</html>
